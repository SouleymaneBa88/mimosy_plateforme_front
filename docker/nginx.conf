# nginx : point d'entrée unique de MIMOSY en production.
#
#   /            application Vue (fichiers compilés)
#   /api/        API REST        → Daphne (backend:8000)
#   /admin/      admin Django    → Daphne
#   /ws/         WebSocket       → Daphne (mise à niveau HTTP → WebSocket)
#   /static/     fichiers statiques Django (collectstatic)
#   /media/profiles/  photos de profil (publiques)
#   /media/...   tout le reste REFUSÉ : pièces d'identité et preuves de litige
#                ne passent que par l'API authentifiée.

upstream backend {
    server backend:8000;
}

# « Connection: upgrade » seulement si le navigateur demande un WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Dépôt de fichiers : pièce d'identité (5 Mo), preuves de litige (10 Mo).
    client_max_body_size 12m;
    server_tokens off;

    root /usr/share/nginx/html;

    # En-têtes transmis à Django. X-Forwarded-Proto est ÉCRASÉ par nginx (jamais
    # repris du client) : Django s'y fie pour savoir si la connexion est en HTTPS.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend;
    }

    location /admin/ {
        proxy_pass http://backend;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Une connexion WebSocket reste ouverte longtemps sans trafic.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location /media/profiles/ {
        alias /srv/media/profiles/;
        expires 1d;
    }

    location /media/ {
        return 404;
    }

    # Routes de l'application Vue (mode « history ») : toute adresse inconnue
    # renvoie index.html, le routeur Vue affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
